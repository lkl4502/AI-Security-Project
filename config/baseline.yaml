system:
  random_seed: 42
  device: "cuda" # "cpu", "auto", "cuda"

data:
  uci_id: 891 # dataset id
  test_size: 0.2

  # "under" -> 작은 샘플에 맞추기
  # "smote" -> 작은 샘플 생성하여 확장
  # "none" -> 아무 작업 X
  sampling_method: "under"
  sampling_ratio: 0.5 # 비율 -> 작은 거 / 큰 거

  batch_size: 64
  num_workers: 2

model:
  name: "autoencoder"

  lr: 0.001
  epochs: 10
  hidden_dim: 16

  # Machine Learning Params
  n_estimators: 100 # For RF
  contamination: 0.15 # For Isolation Forest

paths:
  save_dir: "./saved_models"

# Wandb
wandb:
  team_name: "lkl4502-kookmin-university"
  project_name: "AI-Security-Project"
  experiment_name: "baseline"
